name: Update charts
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: update-charts, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch_data.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "Update charts"
          for a in 1 2 3 4 5; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0; sleep $((RANDOM % 6 + 3)); done
          exit 1
